<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoKnowledge</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <header class="topbar">
    <h1><a class="brand" href="./">GeoKnowledge</a></h1>
  </header>

  <main>
    <section class="hero">
      <h2>Test your geography knowledge.</h2>
      <p class="lead">Pick a game below.</p>
    </section>

    <nav class="game-list" aria-label="Games">
      <a class="game-card" href="higher-lower/">
        <span class="game-card__emoji" aria-hidden="true">📈</span>
        <span class="game-card__title">Higher or Lower</span>
        <span class="game-card__desc">Two countries, one stat. Guess which is higher.</span>
      </a>

      <div class="game-card game-card--soon" aria-disabled="true">
        <span class="game-card__emoji" aria-hidden="true">🧭</span>
        <span class="game-card__title">More games</span>
        <span class="game-card__desc">Coming soon.</span>
      </div>
    </nav>
  </main>

  <footer>
    <p>Built with vanilla HTML, CSS and JS.</p>
  </footer>
</body>
</html>
