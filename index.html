<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoKnowledge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <header class="topbar">
    <h1>
      <a class="brand" href="./">
        <span class="brand__dot" aria-hidden="true"></span>
        GeoKnowledge
      </a>
    </h1>
  </header>

  <main>
    <section>
      <h2 class="section-title">Daily Games</h2>
      <nav class="tile-grid" aria-label="Games">
        <a class="tile tile--pink" href="higher-lower/">
          <span class="tile__badge">NEW</span>
          <span class="tile__art" aria-hidden="true">
            <span class="tile__art-card tile__art-card--up">▲</span>
            <span class="tile__art-card tile__art-card--down">▼</span>
          </span>
          <span class="tile__title">Higher or Lower</span>
        </a>

        <a class="tile tile--green" href="border-chain/">
          <span class="tile__badge">NEW</span>
          <span class="tile__art" aria-hidden="true">🔗</span>
          <span class="tile__title">Border Chain</span>
        </a>

        <a class="tile tile--purple" href="stat-match/">
          <span class="tile__badge">NEW</span>
          <span class="tile__art" aria-hidden="true">📊</span>
          <span class="tile__title">Stat Match</span>
        </a>

        <a class="tile tile--orange" href="country-guess/">
          <span class="tile__badge">NEW</span>
          <span class="tile__art" aria-hidden="true">🔍</span>
          <span class="tile__title">Country Guess</span>
        </a>
      </nav>
    </section>
  </main>

  <footer>
    <p>Built with vanilla HTML, CSS and JS.</p>
  </footer>
</body>
</html>
